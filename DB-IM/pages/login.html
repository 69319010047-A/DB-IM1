<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Sign In</title>
    <!-- เชื่อมต่อไฟล์ CSS -->
    <link rel="stylesheet" href="../src/css/style.css">
    <!-- ฟอนต์ Inter เพื่อความโมเดิร์น -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- เชื่อมต่อไฟล์ JS -->
    <script src="../src/js/app.js" defer></script>
</head>
<body class="modern-dark-theme">
    <div class="auth-layout">
        <!-- Background Glowing Orbs -->
        <div class="glow-orb orb-primary"></div>
        <div class="glow-orb orb-secondary"></div>

        <!-- Glassmorphism Card -->
        <main class="auth-card glass-panel">
            <div class="auth-header">
                <div class="brand-logo">
                    <!-- Logo อนาคตสามารถใส่ SVG ได้ตรงนี้ -->
                    <div class="logo-shape"></div>
                </div>
                <h2>Welcome back</h2>
                <p>Sign in to access your workspace</p>
            </div>

            <form id="modernLoginForm" class="auth-form" novalidate>
                <div class="input-group">
                    <label for="email">Email</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" placeholder="name@example.com" required autocomplete="email">
                    </div>
                </div>

                <div class="input-group">
                    <div class="label-flex">
                        <label for="password">Password</label>
                        <a href="#" class="forgot-link" tabindex="-1">Forgot?</a>
                    </div>
                    <div class="input-wrapper password-wrapper">
                        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" id="togglePassword" class="btn-icon" aria-label="Toggle password visibility">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="btn-gradient">
                    <span class="btn-text">Sign In</span>
                    <svg class="loader hidden" viewBox="0 0 50 50">
                        <circle class="path" cx="25" cy="25" r="20" fill="none" stroke-width="5"></circle>
                    </svg>
                </button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account? <a href="#">Create one</a></p>
            </div>
        </main>
    </div>

    <!-- Toast Notification -->
    <div id="toastContainer" class="toast-container"></div>
</body>
</html>
